<!--
THESIS: The week is planned on a coach's magnetic tactics board; decisions are marker strokes, facts are print. Refuses the dark wall of equal dashboard cards.
OWN-WORLD: White enamel board in an aluminium frame, faint teal pitch print, club-coloured shirt magnets on round bases, navy ink, dry-erase green/red/blue marker in a hand face, grey tray rail.
STORY: Check the league and deadline, study the suggested XI on the board, try alternatives by moving magnets, read the evidence, then act in the FPL app.
FIRST VIEWPORT: Tray rail with league rank on the left; top bar with snapshot time and refresh; Overview opens with the weekly call strip. My squad opens on the board.
FORM: Grounded direction 4 (tactics magnetic board), seed 2ba8e144; approved mockup .impeccable/mockups/a-tactics-board.html.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPL Brief — #club-football</title>
</head>
<body>
  <div class="app-shell">
    <aside class="league-rail">
      <a class="wordmark" href="#overview"><span class="ball" aria-hidden="true">●</span> FPL BRIEF</a>
      <p class="rail-label">Mini-league</p>
      <div id="league-snapshot" class="league-snapshot skeleton" aria-live="polite"></div>
      <nav aria-label="Dashboard sections">
        <button class="nav-link active" data-view="overview">Overview</button>
        <button class="nav-link" data-view="squad">My squad <span id="nav-alerts" class="nav-count"></span></button>
        <button class="nav-link" data-view="wildcard">Wildcard lab</button>
        <button class="nav-link" data-view="rivals">Rivals</button>
        <button class="nav-link" data-view="players">Player pool</button>
      </nav>
      <p class="rail-foot">Public FPL data only.<br>Never makes transfers.</p>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1>Plan the next move</h1>
        </div>
        <div class="top-actions">
          <span id="snapshot-time" class="status-text">Loading snapshot</span>
          <span id="refresh-status" class="status-text" aria-live="polite"></span>
          <button id="refresh" class="button-primary">Refresh FPL data</button>
          <a id="sign-out" class="sign-out" href="/logout" hidden>Sign out</a>
        </div>
      </header>
      <div id="stale-banner" hidden></div>
      <section id="overview" class="view active"></section>
      <section id="squad" class="view"></section>
      <section id="wildcard" class="view"></section>
      <section id="rivals" class="view"></section>
      <section id="players" class="view"></section>
    </main>
  </div>
  <script type="module" src="/app.ts"></script>
</body>
</html>
